name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        dependencies: [highest]
        include:
          - php: "8.3"
            dependencies: lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, sockets, pdo_sqlite, openssl
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi

      - name: Lint every source file
        run: |
          set -euo pipefail
          find src tests examples -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage --colors=always

  handshake:
    name: Real socket round trip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sockets
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      # The unit tests drive the protocol directly, which proves the messages
      # are right and nothing about the transport. This starts the real server
      # on a real port and completes an RFC6455 handshake against it, so a
      # broken negotiator or frame codec fails here rather than in production.
      - name: Handshake, subscribe, publish, receive
        run: php tests/integration/round-trip.php
